name: Sort FMHY bookmarks and commit

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  SORTER_VERSION: v0.4.0
  SORTER_CACHE_DIR: ./.cache/bookmark-sorter

jobs:
  sort-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7

      - name: Restore cached sorter binary
        uses: actions/cache@v5
        with:
          # Key must change when the binary changes; update SORTER_VERSION accordingly
          key: sorter-binary-${{ env.SORTER_VERSION }}-${{ runner.os }}
          path: ${{ env.SORTER_CACHE_DIR }}

      - name: Ensure sorter binary is present
        run: |
          set -eux
          mkdir -p "${SORTER_CACHE_DIR}"
          if [ ! -f "${SORTER_CACHE_DIR}/bookmark-sorter" ]; then
            echo "Cache miss: downloading sorter ${SORTER_VERSION}"
            curl -L -sSf -o "${SORTER_CACHE_DIR}/bookmark-sorter" \
              "https://github.com/AlfElFriki/fmhy-bookmarks-sort/releases/download/${SORTER_VERSION}/bookmark-sorter"
            chmod +x "${SORTER_CACHE_DIR}/bookmark-sorter"
          else
            echo "Using cached sorter ${SORTER_VERSION}"
          fi

      - name: Run sorter and write fmhy_in_bookmarks_sorted.html
        run: |
          set -eux
          "${SORTER_CACHE_DIR}/bookmark-sorter" --online

      - name: Show changes
        run: |
          git status --porcelain || true
          git --no-pager diff --name-only || true

      - name: Commit & push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fmhy_in_bookmarks_sorted.html
          if ! git diff --staged --quiet; then
            git commit -m "chore: update sorted fmhy bookmarks (automated)"
            git push
          else
            echo "No changes to commit"
          fi
