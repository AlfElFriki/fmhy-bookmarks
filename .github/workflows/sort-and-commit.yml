name: Sort FMHY bookmarks and commit

on:
  schedule:
    # every 6 hours (extension polls every ~6h according to README)
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sort-and-commit:
    # avoid running for commits made by the bot itself (defense-in-depth)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Download prebuilt sorter binary (release v0.4.0)
        run: |
          set -eux
          curl -L -o bookmark-sorter \
            "https://github.com/AlfElFriki/fmhy-bookmarks-sort/releases/download/v0.4.0/bookmark-sorter"
          chmod +x bookmark-sorter

      - name: Run sorter and write fmhy_in_bookmarks_sorted.html
        run: |
          ./bookmark-sorter --online

      - name: Show changes
        run: |
          git status --porcelain || true
          git --no-pager diff --name-only || true

      - name: Commit & push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fmhy_in_bookmarks_sorted.html
          if ! git diff --staged --quiet; then
            git commit -m "chore: update sorted fmhy bookmarks (automated)"
            git push
          else
            echo "No changes to commit"
          fi
